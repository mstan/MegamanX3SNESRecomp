# Mega Man X3 (USA) — LLE-first seed.
#
# auto_vectors reads the LoROM internal header's interrupt vector table and
# seeds func I_RESET / I_NMI / I_IRQ at the dereferenced PCs, so this file
# needs no hand-decoded entry points.
#
# tier_down_stubs makes cross-bank unresolved-function stubs RUN the real ROM
# bytes through the interpreter instead of trapping — the bring-up posture.
# Drop it once static coverage is broad enough to stand alone.
bank = 0
auto_vectors
tier_down_stubs

# $03:8DA0 calls a runtime-generated WRAM helper that rewrites the guest
# return stack and returns directly to $00:DD59's caller. Native callable
# frames cannot represent that non-local return, so this exact boundary must
# remain on the interpreter tier even when a coverage profile promotes it.
force_lle 038DA0

# $00:9133 uses the same stack-programmed WRAM dispatcher family, entering at
# $7E:26A6 during the CAPCOM/title transition. Its helper-selected non-local
# return cannot be represented by the native callable ABI either.
force_lle 009133

# $02:EFF2 brackets an indirect tail-dispatch with PHX/PHP and PLP/PLX.
# Splitting that bracket across native function boundaries loses the saved
# X-width state, so the generated PLX pops one byte instead of two and shifts
# the RTS frame. Keep the whole bracket on the interpreter tier.
force_lle 02EFF2

# Runtime coverage found these exact non-call landings after the original
# tier-2 profile was captured. Profile manifests intentionally root call_gap
# targets directly but require an audited cfg boundary for goto_gap and
# indirect_dispatch targets. Keep the observed entry M/X mode on each seed.
func bank_00_84CA 84CA entry_mx:1,0
func bank_00_96F6 96F6 entry_mx:1,1
func bank_00_C52D C52D entry_mx:1,1
func bank_00_C54F C54F entry_mx:1,1
func bank_00_C55F C55F entry_mx:1,1
func bank_00_C58E C58E entry_mx:1,1
func bank_00_C996 C996 entry_mx:1,1
func bank_00_C9C6 C9C6 entry_mx:1,1
func bank_00_C9EF C9EF entry_mx:1,1
